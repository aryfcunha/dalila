# Dalila — region → country mapping for the /region command.
#
# Region taxonomy follows UAE Foreign Aid Policy 2026 Ch 5 (geographic focus).
# Country codes are ISO-3166-1 alpha-2 to match the `country_focus` field
# the classifier emits.
#
# Coverage rationale:
#   - Middle East & Arab States: priority region per policy (>50% of dev assistance).
#     Includes all 22 Arab League members plus Iran (frequently classified
#     under Middle East in coverage).
#   - Africa: sub-Saharan + non-Arab North African (Morocco/Tunisia/Algeria stay
#     in Middle East & Arab States to match the policy's chapter split).
#   - Asia: South + Southeast + Central + East Asia excluding the Middle East.
#   - Latin America: Central + South America + Caribbean mainland states.
#   - SIDS: Small Island Developing States across all oceans, per UN-OHRLLS list.
#
# Edit when a new country appears in classifier output that isn't covered —
# the /region command will skip uncovered countries silently.

regions:
  middle-east-arab-states:
    label: "Middle East & Arab States"
    countries: [AE, SA, KW, QA, BH, OM, YE, IQ, JO, LB, SY, PS, EG, LY, TN, DZ, MA, MR, SD, SO, DJ, KM, IR]

  africa:
    label: "Africa (excl. Middle East & Arab States)"
