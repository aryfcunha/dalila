# prediction_markets.yaml
#
# Settings for the prediction markets polling system.
# The market watchlist is FULLY DYNAMIC — no static market IDs are maintained here.
# Markets are discovered automatically by searching Manifold for the top entities
# and topics from the past 7 days' digest items.
#
# These settings control discovery quality, alert sensitivity, and digest display.

discovery:
  # How many days of digest history to mine for entity extraction
  digest_lookback_days: 7

  # Top N entity terms to use as Manifold search queries
  entity_limit: 12

  # Minimum Manifold volume (Mana) for a discovered market to qualify
  min_volume: 300

  # Maximum number of discovered markets to track at once
  max_markets: 25

  # Permanent anchor seeds — always searched on every discovery cycle.
  # Dynamic seeds derived from recent high-UAE-relevance classified news are
  # appended automatically (see ingestors/prediction_markets.py:_extract_news_seeds).
  # These anchors guarantee baseline UAE / humanitarian / development coverage
  # even when news seeds drift toward unrelated topics.
  domain_seeds:
    - "Sudan"
    - "OPEC"
    - "Saudi UAE"
    - "Hormuz"
    - "Drone UAE"
    - "Pakistan Afghanistan"
    - "Sahel"
    - "Yemen"
    - "Syria"
    - "Gaza humanitarian"
    - "UAE aid"
    - "humanitarian funding"

  # Off-topic categories dropped at discovery. These are ADDED to the
  # built-in defaults (sports / entertainment / celebrity health & death)
  # in ingestors/prediction_markets.py:_EXCLUDE_DEFAULTS. Add regex or
  # plain substrings (case-insensitive) to exclude more, e.g. US-domestic
  # culture-war questions.
  exclude_terms:
    - "christian affiliation"
    - "gay marriage"
    - "worst us president"
    - "impeach"
    - "illegal to move"

alerts:
  # Minimum absolute probability move (0–1) over 1h to trigger a breaking signal
  threshold_1h: 0.05
  # Minimum absolute probability move (0–1) over 24h to trigger a breaking signal
  threshold_24h: 0.08

digest:
  # How many market signals to show in the daily brief
  top_n: 5
