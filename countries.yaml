# Dalila — canonical country catalogue.
#
# Used by:
#   * the classifier (country_focus normalisation)
#   * the /country Telegram command (alias resolution)
#   * the country view page (region grouping + heatmap)
#
# Codes are ISO-3166-1 alpha-2. Aliases capture common name variants we see
# in real news (e.g. "USA", "Türkiye", "DRC"). Add aliases freely as you
# spot mis-attributions; do not change the canonical `name` or `region`.
#
# Regions follow the user's 15-region taxonomy. Some borderline cases:
#   * Egypt, Libya, Tunisia, Algeria, Morocco, Mauritania → North Africa
#   * Sudan, South Sudan → Eastern Africa (UN groups Sudan in N Africa
#     but Dalila treats both as part of the Horn/Sahel humanitarian theatre)
#   * Turkey → Middle East (per ODA practice; UN puts it in W Asia)
#   * Cyprus → Middle East
#   * Russia → Eastern Europe (geopolitically; UN puts it in E Europe + N Asia)
#   * Iran → Middle East (not Central Asia)
#   * Afghanistan → South Asia (not Central Asia)

regions:
  north-america:
    label: North America
    countries: [US, CA]
  central-america:
    label: Central America
    countries: [MX, GT, BZ, HN, SV, NI, CR, PA, CU, JM, HT, DO, BS, TT]
  south-america:
    label: South America
    countries: [CO, VE, GY, SR, EC, PE, BR, BO, PY, CL, AR, UY]
  western-europe:
    label: Western Europe
    countries: [GB, IE, FR, BE, NL, LU, DE, AT, CH, IT, ES, PT, GR, MT, IS, NO, SE, FI, DK]
  eastern-europe:
    label: Eastern Europe
    countries: [PL, CZ, SK, HU, RO, BG, RS, HR, SI, BA, MK, AL, ME, XK, MD, UA, BY, RU, EE, LV, LT]
  north-africa:
    label: North Africa
    countries: [EG, LY, TN, DZ, MA, MR]
  eastern-africa:
    label: Eastern Africa
    countries: [SD, SS, ET, ER, DJ, SO, KE, UG, RW, BI, TZ, MW, MZ, ZW, ZM, MG, KM, SC, MU]
  western-africa:
    label: Western Africa
    countries: [ML, BF, NE, TD, NG, SN, GM, GW, GN, SL, LR, CI, GH, TG, BJ, CV, CF, CM, CG, CD, GA, GQ, ST]
  southern-africa:
    label: Southern Africa
    countries: [ZA, NA, BW, LS, SZ, AO]
  middle-east:
    label: Middle East
    countries: [SA, AE, KW, BH, QA, OM, YE, JO, LB, SY, IQ, IR, IL, PS, TR, CY]
  south-asia:
    label: South Asia
    countries: [IN, PK, BD, NP, BT, LK, MV, AF]
  central-asia:
    label: Central Asia
    countries: [KZ, KG, TJ, TM, UZ]
  north-east-asia:
    label: North East Asia
    countries: [CN, MN, KP, KR, JP, TW, HK, MO]
  south-east-asia:
    label: South East Asia
    countries: [TH, VN, LA, KH, MM, ID, MY, SG, BN, PH, TL]
  asia-pacific:
    label: Asia-Pacific
    countries: [AU, NZ, PG, FJ, SB, VU, WS, TO, KI, MH, FM, PW, NR, TV]

