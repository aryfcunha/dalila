<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalila — Archive</title>
<style>
:root {
  --bg:#0A0A0A;
  --bg-deep:#000000;
  --type:#E8E1D3;
  --type-dim:#9A958A;
  --muted:#6E6A60;
  --amber:#FFB454;
  --amber-deep:#D88E30;
  --cyan:#7AB9C9;
  --green:#7CB36E;
  --red:#D67866;
  --rule:#1F1B16;
  --rule-strong:#3A332A;
}
html,body {
  background: var(--bg);
  color: var(--type);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body {
  margin: 0;
  font-family: "JetBrains Mono", "IBM Plex Mono", "SF Mono", "Source Code Pro", Consolas, monospace;
  font-size: 14px;
  line-height: 1.55;
  letter-spacing: 0.01em;
}
.serif {
  font-family: "Iowan Old Style", "Source Serif Pro", "PT Serif", Georgia, "Times New Roman", serif;
  font-feature-settings: "kern", "liga", "calt";
}
a {
  color: var(--cyan);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.12s ease, color 0.12s ease;
}
a:hover {
  color: var(--amber);
  border-bottom-color: var(--amber);
}
.wrap { max-width: 880px; margin: 0 auto; padding: 28px 32px 80px; }

/* ---------- masthead ---------- */
.masthead {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 18px;
  align-items: baseline;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--amber);
  margin-bottom: 18px;
}
.masthead-title {
  font-family: "Iowan Old Style", "Source Serif Pro", Georgia, serif;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1;
  margin: 0;
  color: var(--type);
}
.masthead-title a { color: var(--type); border: 0; }
.masthead-title .ar {
  color: var(--amber);
  font-style: italic;
  font-weight: 400;
  font-size: 0.65em;
  margin-left: 8px;
  vertical-align: 3px;
}
.masthead-tag {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  border-left: 1px solid var(--rule-strong);
  padding-left: 14px;
  margin-left: 6px;
}
.masthead-nav {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: right;
}
.masthead-nav a {
  color: var(--muted);
  margin-left: 14px;
  border: 0;
}
.masthead-nav a[aria-current=page] { color: var(--amber); }
.masthead-nav a:hover { color: var(--type); }

/* ---------- ticker strip ---------- */
.ticker {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0 0 18px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 24px;
}
.ticker span {
  padding: 0 14px;
  border-right: 1px solid var(--rule-strong);
}
.ticker span:first-child { padding-left: 0; }
.ticker span:last-child { border-right: 0; }
.ticker b { color: var(--amber); font-weight: 700; }

/* ---------- top stories ---------- */
.top { margin: 0 0 28px; }
.top-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--amber);
  padding-bottom: 6px;
  margin-bottom: 12px;
}
.top-head .label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--amber);
}
.top-head .count { color: var(--muted); font-size: 10px; letter-spacing: 0.14em; }
.top ol { list-style: none; padding: 0; margin: 0; counter-reset: t; }
.top li {
  counter-increment: t;
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 14px;
  padding: 9px 0;
  border-bottom: 1px solid var(--rule);
  align-items: baseline;
}
.top li:last-child { border-bottom: 0; }
.top li::before {
  content: counter(t, decimal-leading-zero);
  color: var(--amber);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.08em;
}
.top a {
  color: var(--type);
  font-family: "Iowan Old Style", "Source Serif Pro", Georgia, serif;
  font-size: 16px;
  line-height: 1.4;
  border-bottom: 1px solid transparent;
}
.top a:hover {
  color: var(--amber);
  border-bottom-color: var(--amber);
}
.top .ref { color: var(--muted); font-size: 10px; margin-left: 6px; letter-spacing: 0.08em; }

/* ---------- sections ---------- */
.section { margin: 0 0 30px; }
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--rule-strong);
  padding-bottom: 6px;
  margin-bottom: 12px;
}
.section-head .label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--type);
}
.section-head .count {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.14em;
}

/* ---------- items ---------- */
.item {
  padding: 14px 0 16px;
  border-bottom: 1px solid var(--rule);
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 14px;
}
.item:last-child { border-bottom: 0; }
.item-n {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  padding-top: 2px;
}
.item-body .title {
  font-family: "Iowan Old Style", "Source Serif Pro", Georgia, serif;
  font-size: 16px;
  line-height: 1.4;
  font-weight: 600;
  color: var(--type);
  margin: 0 0 6px;
}
.item-body .title a {
  color: var(--type);
  border-bottom: 1px solid transparent;
}
.item-body .title a:hover {
  color: var(--amber);
  border-bottom-color: var(--amber);
}
.item-body .summary {
  font-family: "Iowan Old Style", "Source Serif Pro", Georgia, serif;
  font-size: 14px;
  color: var(--type-dim);
  margin: 0 0 8px;
  line-height: 1.55;
}
.item-body .meta {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
}
.item-body .meta .src { color: var(--type-dim); }
.item-body .meta .rel { color: var(--amber); }
.item-body .meta .sev { color: var(--muted); }
.item-body .meta a { color: var(--cyan); border: 0; }
.item-body .meta a:hover { color: var(--amber); }
.doctrine-tag {
  border: 1px solid var(--amber);
  color: var(--amber);
  padding: 1px 6px;
  font-size: 9px;
  letter-spacing: 0.14em;
  font-weight: 700;
}

/* ---------- footer ---------- */
.foot {
  margin-top: 56px;
  padding-top: 14px;
  border-top: 1px solid var(--amber);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 10px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--muted);
}
.foot a { color: var(--muted); border: 0; }
.foot a:hover { color: var(--amber); }

/* ---------- archive ---------- */
.archive-row {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 18px;
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
  align-items: baseline;
}
.archive-date {
  color: var(--amber);
  font-size: 11px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
}
.archive-title a {
  color: var(--type);
  font-family: "Iowan Old Style", Georgia, serif;
  font-size: 16px;
  line-height: 1.4;
  border-bottom: 1px solid transparent;
}
.archive-title a:hover { color: var(--amber); border-bottom-color: var(--amber); }
.archive-preview { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.5; }

/* ---------- about ---------- */
.about p, .about ul, .about li {
  font-family: "Iowan Old Style", Georgia, serif;
  font-size: 15px;
  line-height: 1.65;
  color: var(--type-dim);
  max-width: 64ch;
}
.about h2 {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--amber);
  border-bottom: 1px solid var(--rule-strong);
  padding-bottom: 6px;
  margin: 34px 0 14px;
}
.about strong { color: var(--type); }
.about code {
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 0.9em;
  color: var(--amber);
  background: var(--bg-deep);
  padding: 1px 5px;
  border: 1px solid var(--rule-strong);
}
.source-block {
  margin: 0 0 22px;
  padding: 8px 0 0 16px;
  border-left: 1px solid var(--rule-strong);
}
.source-block strong {
  display: block;
  color: var(--amber);
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.source-block ul { list-style: none; padding: 0; margin: 0; }
.source-block li {
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 12px;
  color: var(--type-dim);
  padding: 3px 0;
}
.source-block li .note { color: var(--muted); margin-left: 4px; }

/* ---------- countries view ---------- */
.country-controls {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin: 6px 0 22px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--rule);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.country-controls label { color: var(--muted); margin-right: 4px; }
.region-pill {
  display: inline-block;
  padding: 3px 8px;
  border: 1px solid var(--rule-strong);
  color: var(--type-dim);
  cursor: pointer;
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 10px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
}
.region-pill:hover { color: var(--amber); border-color: var(--amber-deep); }
.region-pill.active { color: var(--bg); background: var(--amber); border-color: var(--amber); }

.region-block { margin: 0 0 22px; }
.region-head {
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
}
.region-head .count { color: var(--muted); }
.tile-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.tile {
  width: 44px; height: 44px;
  background: var(--bg-deep);
  border: 1px solid var(--rule-strong);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--type-dim);
  cursor: pointer;
  text-align: center;
  transition: border-color 0.12s ease, color 0.12s ease;
  position: relative;
}
.tile:hover { border-color: var(--amber); color: var(--type); z-index: 2; }
.tile .num {
  font-size: 9px;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 0.02em;
  margin-top: 1px;
}
.tile.selected {
  border-color: var(--amber);
  color: var(--bg);
  background: var(--amber);
}
.tile.selected .num { color: rgba(10,10,10,0.6); }
.tile.dim { opacity: 0.28; }
.tile.empty { color: var(--muted); }
/* Heatmap shades (data-h attribute set by JS) */
.tile[data-h="1"] { background: #1a1409; border-color: #2a1f12; color: var(--type-dim); }
.tile[data-h="2"] { background: #2c1f0a; border-color: #3d2912; color: var(--type-dim); }
.tile[data-h="3"] { background: #4a3110; border-color: #5d3e14; color: var(--type); }
.tile[data-h="4"] { background: #75501a; border-color: #8a611f; color: var(--type); }
.tile[data-h="5"] { background: #a47424; border-color: #b88229; color: var(--bg); }
.tile[data-h="6"] { background: var(--amber-deep); border-color: var(--amber); color: var(--bg); }

#country-detail {
  margin: 28px 0 0;
  padding-top: 16px;
  border-top: 1px solid var(--rule-strong);
}
.country-detail-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
}
.country-detail-head h2 {
  margin: 0;
  font-family: "Iowan Old Style", Georgia, serif;
  font-size: 22px;
  color: var(--amber);
  font-weight: 700;
}
.country-detail-head .meta {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.country-cofreq {
  font-size: 11px;
  color: var(--type-dim);
  margin: 0 0 14px;
  letter-spacing: 0.04em;
}
.country-cofreq .pair {
  display: inline-block;
  margin-right: 12px;
  margin-bottom: 4px;
  padding: 2px 6px;
  border: 1px solid var(--rule-strong);
  color: var(--type-dim);
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
}
.country-cofreq .pair b { color: var(--amber); font-weight: 700; margin-left: 4px; }
.country-news-empty {
  color: var(--muted);
  font-size: 13px;
  font-style: italic;
  padding: 28px 0;
  text-align: center;
}

/* ---------- print + mobile ---------- */
@media print {
  html,body { background: white; color: black; }
  a { color: black; text-decoration: underline; }
  .masthead-nav, .foot { display: none; }
}
@media (max-width: 640px) {
  .wrap { padding: 22px 18px 60px; }
  .masthead { grid-template-columns: 1fr; gap: 8px; }
  .masthead-tag { border-left: 0; padding-left: 0; margin-left: 0; }
  .masthead-nav { text-align: left; }
  .ticker { font-size: 9px; }
  .ticker span { padding: 0 8px; }
  .archive-row { grid-template-columns: 1fr; gap: 4px; }
  .item { grid-template-columns: 1fr; gap: 6px; }
  .item-n { font-size: 10px; padding: 0; }
}
</style>
</head>
