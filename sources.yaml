  # =====================================================================
  # Email-subscription firehose (dalila.dev.digest@gmail.com)
  # CGD, The Economist, Devex Newswire — all delivered via newsletter to
  # the bot's dedicated Gmail account. Ingestor pulls via IMAP, treats each
  # email as one item, parses links out of the body.
  # =====================================================================
  - id: gmail_newsletters
    name: Gmail newsletters — CGD / Economist / Devex
    kind: gmail
    url: ""
    quality: 5
    tags: [specialist, newsletter, email]
    enabled: true
    # IMAP credentials come from GMAIL_USER and GMAIL_APP_PASSWORD env vars.
    # See README → Gmail ingestion setup.
    window_days: 1

# Pre-filter: items must match at least one of these keywords or one entity from
# entities.yaml before being sent to the Haiku classifier. Drops ~80% of global-wire
# volume before paying LLM cost. Case-insensitive substring match against title+body.
prefilter_keywords:
  - UAE
  - Emirates
  - Abu Dhabi
  - Dubai
  - Sharjah
  - humanitarian
  - aid
  - refugee
  - displacement
  - famine
  - donor
  - philanthropy
  - foundation
  - sustainable development
  - foreign assistance
  - food security
  - climate finance
  - Gaza
  - Sudan
  - Yemen
  - Syria
  - Ukraine
  - DRC
  - Sahel
  - Ethiopia
  - Horn of Africa
