# Dalila — source registry (MVP, free-only)
#
# `kind` controls which ingestor handles the source:
#   rss       — feedparser
#   gdelt     — GDELT 2.0 v2 export
#   acled     — ACLED v3 API (requires ACLED_API_KEY + ACLED_EMAIL)
#   idmc      — IDMC RSS/reports
#   scrape    — generic HTML scraper (BeautifulSoup) — used as fallback for sites without RSS
#
# `quality` is a 1–5 score used in the editor to weight which items reach the digest.
# `enabled: false` skips the source without removing it.

sources:
  # =====================================================================
  # UAE state & wire (highest signal for our use case)
  # =====================================================================
  - id: wam_en
    name: Emirates News Agency (WAM)
    # WAM has no public RSS (verified 2026-05-12; /feed and /en/rss return HTML).
    # Their news pages are React-rendered — static HTML contains no article cards,
    # so the current scraper finds 0 items. Re-enable when v0.2 adds Playwright.
    kind: scrape
    url: https://wam.ae/en/section/news
    selector: "article, .news-item, .post, .card, a[href*='/details/']"
    quality: 5
    tags: [uae, state, wire]
    enabled: false

  - id: mofa_uae
    name: UAE Ministry of Foreign Affairs
    # Also JS-rendered. Disabled until Playwright support lands.
    kind: scrape
    url: https://www.mofa.gov.ae/en/mediahub/news
    selector: "article, .news-item, .card"
    quality: 5
    tags: [uae, state, mofa]
    enabled: false

  # =====================================================================
  # UAE local press
  # =====================================================================
  - id: the_national
    name: The National
    kind: rss
    url: https://www.thenationalnews.com/arc/outboundfeeds/rss/?outputType=xml
    # Bumped to 5: with WAM/MoFA disabled (JS-rendered), The National is the
    # highest-signal UAE-perspective source we currently have. It carries
    # substantive bodies (~6KB avg) and covers UAE leadership statements,
    # MoFAIC readouts, and ecosystem moves that don't reach Reuters/NYT.
    quality: 5
    tags: [uae, press]
    enabled: true

  - id: gulf_news
    name: Gulf News
    kind: rss
    url: https://gulfnews.com/feed
    quality: 3
    tags: [uae, gulf, press]
    enabled: true

  # =====================================================================
  # UAE operating entities (the ecosystem) — most need scraping; verify URLs
  # =====================================================================
  - id: erc
    name: Emirates Red Crescent
    # Same JS-rendered story as WAM/MoFA — scraper finds 0 cards. ERC's TLS cert
    # is signed by the UAE Crown Prince Court CA (not in standard trust stores),
    # which is why we set verify_ssl: false; that part is solved. The blocker is
    # JS rendering. Re-enable in v0.2.
    kind: scrape
    url: https://www.emiratesrc.ae/en/news
    selector: "article, .news-item, .card, a[href*='/news/']"
    verify_ssl: false
    quality: 5
    tags: [uae, entity, erc]
    enabled: false

  - id: khalifa_foundation
    name: Khalifa bin Zayed Foundation
    kind: scrape
    url: https://www.kbzf.gov.ae/en/news       # TODO verify
    selector: "article, .news-item"
    quality: 5
    tags: [uae, entity, khalifa]
    enabled: false                              # turn on after URL is verified

  - id: erth_zayed
    name: Erth Zayed Philanthropies
    # https://erthzayed.ae/ is currently a splash page only — logo + copyright +
    # a privacy-policy link, no news section, no press releases. Verified
    # 2026-05-12. The real Erth Zayed signal will reach Dalila via mentions in
    # other sources (entities.yaml has the aliases). Re-enable as a scrape
    # source if/when the entity publishes a public news/press URL.
    kind: scrape
    url: https://erthzayed.ae/
    selector: "article, .news-item, .post"
    quality: 5
    tags: [uae, entity, erth-zayed]
    enabled: false

  - id: uae_aid
    name: UAE Aid Agency
    # SSL fix applied (UAE Crown Prince CA); blocker is JS-rendered pages.
    kind: scrape
    url: https://www.uaeaid.ae/
    selector: "article, .news-item, .card, .post, a[href*='/news/']"
    verify_ssl: false
    quality: 5
    tags: [uae, entity, uae-aid]
    enabled: false

  # =====================================================================
  # Global wires (free RSS — no paid wire fees)
  # =====================================================================
  - id: reuters_world
    name: Reuters — World
    # Reuters retired feeds.reuters.com circa 2020 and has no free RSS replacement.
    # Reuters content reaches us via Google News / aggregator surfaces (BBC, NYT,
    # Al Jazeera already cite Reuters). Leaving entry here as a reminder; disabled.
    kind: rss
    url: https://feeds.reuters.com/Reuters/worldNews
    quality: 5
    tags: [global, wire]
    enabled: false

  - id: nyt_world
    name: New York Times — World
    kind: rss
    url: https://rss.nytimes.com/services/xml/rss/nyt/World.xml
    quality: 5
    tags: [global, press]
    enabled: true

  - id: nyt_africa
    name: New York Times — Africa
    kind: rss
    url: https://rss.nytimes.com/services/xml/rss/nyt/Africa.xml
    quality: 5
    tags: [global, press, africa]
    enabled: true

  - id: nyt_middleeast
    name: New York Times — Middle East
    kind: rss
    url: https://rss.nytimes.com/services/xml/rss/nyt/MiddleEast.xml
    quality: 5
    tags: [global, press, middle-east]
    enabled: true

  - id: wapo_world
    name: Washington Post — World
    kind: rss
    url: http://feeds.washingtonpost.com/rss/world
    quality: 5
    tags: [global, press]
    enabled: true

  - id: bbc_world
    name: BBC News — World
    kind: rss
    url: http://feeds.bbci.co.uk/news/world/rss.xml
    quality: 4
    tags: [global, press]
    enabled: true

  - id: aljazeera_en
    name: Al Jazeera English
    kind: rss
    url: https://www.aljazeera.com/xml/rss/all.xml
    quality: 4
    tags: [global, press, middle-east]
    enabled: true

  # =====================================================================
  # Specialist humanitarian / development press
  # =====================================================================
  - id: devex
    name: Devex News
    # Devex /news.rss returns HTML to bots (DataDome protection) despite advertising
    # application/rss+xml on HEAD. Same wall as TNH. Disabled until either a
    # subscription opens up the feed or v0.2 ships a browser-based fetcher.
    kind: rss
    url: https://www.devex.com/news.rss
    quality: 5
    tags: [dev, specialist]
    enabled: false

  - id: relief_web
    name: ReliefWeb
    kind: rss
    url: https://reliefweb.int/updates/rss.xml
    quality: 5
    tags: [humanitarian, multilateral]
    enabled: true

  - id: new_humanitarian
    name: The New Humanitarian
    # TNH is behind Cloudflare with strict bot protection (403 on all RSS
    # paths probed 2026-05-12, even with a browser User-Agent). Disabled until
    # a workable feed URL or a permitted scraping arrangement is found.
    kind: rss
    url: https://www.thenewhumanitarian.org/rss/all
    quality: 4
    tags: [humanitarian, specialist]
    enabled: false

  # =====================================================================
  # Real-time event detection
  # =====================================================================
  - id: gdelt_v2
    name: GDELT 2.0 Events
    kind: gdelt
    # No URL — ingestor pulls from data.gdeltproject.org/gdeltv2/lastupdate.txt
    url: ""
    quality: 3
    tags: [events, signal]
    enabled: true

  - id: acled
    name: ACLED — armed conflict events
    kind: acled
    # No URL — uses ACLED_API_KEY + ACLED_EMAIL env vars; pulled from acleddata.com/api/acled/read
    url: ""
    quality: 5
    tags: [events, conflict]
    enabled: true                               # silently skipped if no API key

  - id: idmc
    name: IDMC — Internal Displacement Monitoring Centre
    kind: rss
    url: https://www.internal-displacement.org/rss.xml   # TODO verify
    quality: 5
    tags: [humanitarian, displacement]
    enabled: true

# Pre-filter: items must match at least one of these keywords or one entity from
# entities.yaml before being sent to the Haiku classifier. Drops ~80% of global-wire
# volume before paying LLM cost. Case-insensitive substring match against title+body.
prefilter_keywords:
  - UAE
  - Emirates
  - Abu Dhabi
  - Dubai
  - Sharjah
  - humanitarian
  - aid
  - refugee
  - displacement
  - famine
  - donor
  - philanthropy
  - foundation
  - sustainable development
  - foreign assistance
  - food security
  - climate finance
  - Gaza
  - Sudan
  - Yemen
  - Syria
  - Ukraine
  - DRC
  - Sahel
  - Ethiopia
  - Horn of Africa
