# =====================================================================
# Topical priorities — drive both classifier scoring and editor framing
# =====================================================================
topics:
  - name: climate finance
    aliases: [climate funding, climate-resilient development, loss and damage]
    weight: very-high
    note: UAE has a stated doctrinal interest as host of COP28.
  - name: food security
    aliases: [famine, IPC classification, food crisis]
    weight: very-high
  - name: displacement
    aliases: [refugees, IDPs, internally displaced, forced migration]
    weight: very-high
  - name: multilateralism
    aliases: [multilateral cooperation, UN reform]
    weight: high
  - name: conditionality
    aliases: [tied aid, conditional aid]
    weight: high
    note: UAE doctrine has historically been needs-based / non-conditional.
  - name: faith-based aid
    aliases: [Islamic finance, zakat, Islamic social finance, faith-inspired development]
    weight: high
  - name: gender and women's empowerment
    aliases: [women in development, GEWE]
    weight: medium
  - name: education in emergencies
    weight: medium
  - name: maternal and child health
    weight: medium
  - name: WASH
    aliases: [water sanitation hygiene]
    weight: medium
  - name: pandemic preparedness
    weight: medium
  - name: localization
    aliases: [localisation, local leadership, grand bargain]
    weight: high
  - name: anticipatory action
    aliases: [forecast-based financing]
    weight: medium
  - name: humanitarian-development-peace nexus
    aliases: [triple nexus, HDP nexus]
    weight: medium
  - name: private-sector-led development
    aliases: [blended finance, impact investment]
    weight: high
    note: UAE doctrine has emphasised private-sector-led models.

