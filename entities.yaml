# Dalila — entity watchlist
#
# Used by the classifier to (a) score UAE-relevance and (b) tag mentioned entities.
# Loaded into the classifier system prompt verbatim. Edit freely; comments are ignored
# by the classifier but help future Ary/ODA staff maintain the list.
#
# Aliases matter — the classifier matches on any name in the `aliases` list, so add
# variant spellings, common abbreviations, and Arabic transliterations as you discover
# them in the wild.

# =====================================================================
# UAE — Government & Policy
# =====================================================================
uae_government:
  - name: UAE Presidential Court
    aliases: [Presidential Court of the UAE, Diwan]
    kind: gov
    weight: high
  - name: UAE Ministry of Foreign Affairs
    aliases: [MoFA UAE, MoFA, MoFAIC, Ministry of Foreign Affairs and International Cooperation]
    kind: gov
    weight: high
  - name: UAE Cabinet
    aliases: [Cabinet of Ministers, UAE Council of Ministers]
    kind: gov
    weight: medium
  - name: Office for Development Affairs
    aliases: [ODA, ODA UAE]
    kind: gov
    weight: very-high
  - name: International Humanitarian and Philanthropic Council
    aliases: [IHPC, IHC]
    kind: gov
    weight: high
  - name: UAE Ministry of Climate Change and Environment
    aliases: [MoCCAE]
    kind: gov
    weight: medium
  - name: Federal Authority for Government Human Resources
    aliases: [FAHR]
    kind: gov
    weight: low

