# Trusted-outlet allowlist for GDELT-sourced items.
#
# GDELT crawls the entire web of news domains, so without filtering we end up
# accepting articles from regional papers with limited circulation
# (e.g. semissourian.com) alongside Reuters and the FT. This list narrows
# GDELT intake to outlets that are either:
#
#   (a) widely recognised global press with national or international circulation,
#   (b) leading press in a specific country (especially MENA, sub-Saharan
#       Africa, Asia — regions Dalila covers heavily), or
#   (c) specialist humanitarian / development / multilateral publications.
#
# Domain matching is suffix-based: any subdomain of a listed root passes
# (e.g. "english.aawsat.com" matches "aawsat.com"). Strip protocol and
# "www." before comparing.
#
# To allow a new outlet, append its bare domain (no protocol, no www).
# Subscriptions / paywalls are fine — Dalila stores titles and URLs only.

